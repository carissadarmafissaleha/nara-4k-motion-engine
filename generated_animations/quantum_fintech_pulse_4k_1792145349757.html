<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum FinTech Pulse 4K</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #04060E;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        #stage-container {
            width: 3840px;
            height: 2160px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            background: #04060E;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="stage-container">
        <canvas id="stage" width="3840" height="2160"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const TOTAL_FRAMES = 180;
        const WIDTH = 3840;
        const HEIGHT = 2160;

        // Deterministic Data Generation
        const CANDLE_COUNT = 48;
        const candles = [];
        for (let i = 0; i < CANDLE_COUNT; i++) {
            candles.push({
                baseHeight: 150 + (i % 7) * 40,
                volatility: 100 + (i % 3) * 50,
                phase: (i / CANDLE_COUNT) * Math.PI * 4,
                isGreen: i % 2 === 0 || i % 5 === 0
            });
        }

        const nodes = [];
        const nodeLabels = ["BTC", "ETH", "USD", "EUR", "GLD", "TSLA", "AAPL", "NARA"];
        for (let i = 0; i < 8; i++) {
            nodes.push({
                x: WIDTH * 0.1 + (i * WIDTH * 0.12),
                y: HEIGHT * 0.2,
                label: nodeLabels[i],
                radius: 40,
                phase: i * (Math.PI / 4)
            });
        }

        function drawGrid(progress) {
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
            ctx.lineWidth = 2;
            const offset = (progress * 200) % 200;
            
            for (let x = -offset; x < WIDTH; x += 200) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < HEIGHT; y += 200) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(WIDTH, y);
                ctx.stroke();
            }
        }

        function drawCandle(x, y, width, height, wickHeight, color, glowColor, progress) {
            ctx.save();
            ctx.shadowBlur = 30;
            ctx.shadowColor = glowColor;
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;

            // Wick
            ctx.beginPath();
            ctx.moveTo(x + width / 2, y - wickHeight / 2);
            ctx.lineTo(x + width / 2, y + height + wickHeight / 2);
            ctx.stroke();

            // Body
            ctx.fillRect(x, y, width, height);
            
            // Highlight
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(x, y, width / 3, height);
            
            ctx.restore();
        }

        function renderFrame(frameIndex) {
            const progress = (frameIndex % TOTAL_FRAMES) / TOTAL_FRAMES;
            const loopAngle = progress * Math.PI * 2;

            // Clear Background
            ctx.fillStyle = '#04060E';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            drawGrid(progress);

            // Draw Background Glows
            const grd = ctx.createRadialGradient(WIDTH/2, HEIGHT/2, 0, WIDTH/2, HEIGHT/2, WIDTH/1.2);
            grd.addColorStop(0, 'rgba(0, 255, 136, 0.03)');
            grd.addColorStop(1, 'rgba(4, 6, 14, 0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Chart Logic
            const chartY = HEIGHT * 0.55;
            const candleSpacing = WIDTH / (CANDLE_COUNT + 1);
            
            candles.forEach((c, i) => {
                const x = candleSpacing * (i + 0.5);
                const dynamicHeight = c.baseHeight + Math.sin(loopAngle + c.phase) * c.volatility;
                const wickExtra = 40 + Math.cos(loopAngle + c.phase) * 30;
                
                const color = c.isGreen ? '#00FF88' : '#FFD700';
                const glow = c.isGreen ? 'rgba(0, 255, 136, 0.6)' : 'rgba(255, 215, 0, 0.6)';
                
                // Volume Bars at bottom
                const volHeight = 100 + Math.abs(Math.sin(loopAngle + c.phase * 0.5)) * 200;
                ctx.fillStyle = c.isGreen ? 'rgba(0, 255, 136, 0.2)' : 'rgba(255, 215, 0, 0.2)';
                ctx.fillRect(x - 10, HEIGHT - volHeight - 100, 20, volHeight);

                drawCandle(x - 25, chartY - dynamicHeight / 2, 50, dynamicHeight, dynamicHeight + wickExtra, color, glow, progress);
            });

            // Holographic Nodes
            nodes.forEach((node, i) => {
                const driftY = Math.sin(loopAngle + node.phase) * 40;
                const driftX = Math.cos(loopAngle + node.phase * 0.7) * 20;
                const nx = node.x + driftX;
                const ny = node.y + driftY;

                // Connection Lines
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
                ctx.lineWidth = 2;
                ctx.moveTo(nx, ny);
                ctx.lineTo(WIDTH/2, HEIGHT/2);
                ctx.stroke();

                // Circle
                ctx.beginPath();
                ctx.arc(nx, ny, node.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#FFD700';
                ctx.fillStyle = 'rgba(255, 215, 0, 0.1)';
                ctx.fill();

                // Label
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(node.label, nx, ny + 80);
                
                // Percentage
                const pct = (Math.sin(loopAngle + i) * 5.42).toFixed(2);
                ctx.fillStyle = pct >= 0 ? '#00FF88' : '#FF4444';
                ctx.font = '28px monospace';
                ctx.fillText((pct >= 0 ? '+' : '') + pct + '%', nx, ny + 120);
            });

            // HUD Overlay Elements
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
            ctx.lineWidth = 2;
            
            // Top Bar
            ctx.beginPath();
            ctx.moveTo(100, 100);
            ctx.lineTo(WIDTH - 100, 100);
            ctx.stroke();
            
            // Bottom Bar
            ctx.beginPath();
            ctx.moveTo(100, HEIGHT - 100);
            ctx.lineTo(WIDTH - 100, HEIGHT - 100);
            ctx.stroke();

            // Scanning Line
            const scanY = (progress * HEIGHT);
            ctx.beginPath();
            const scanGrd = ctx.createLinearGradient(0, scanY - 50, 0, scanY + 50);
            scanGrd.addColorStop(0, 'rgba(0, 255, 136, 0)');
            scanGrd.addColorStop(0.5, 'rgba(0, 255, 136, 0.15)');
            scanGrd.addColorStop(1, 'rgba(0, 255, 136, 0)');
            ctx.fillStyle = scanGrd;
            ctx.fillRect(0, scanY - 50, WIDTH, 100);

            // Time & Status
            ctx.fillStyle = '#00FF88';
            ctx.font = '40px monospace';
            ctx.textAlign = 'left';
            ctx.fillText("SYSTEM STATUS: OPTIMAL", 150, 80);
            ctx.textAlign = 'right';
            ctx.fillText("LATENCY: 1.2ms", WIDTH - 150, 80);
            
            // Decorative Corner Brackets
            const bSize = 60;
            const margin = 50;
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 8;
            
            // TL
            ctx.beginPath();
            ctx.moveTo(margin, margin + bSize); ctx.lineTo(margin, margin); ctx.lineTo(margin + bSize, margin);
            ctx.stroke();
            // TR
            ctx.beginPath();
            ctx.moveTo(WIDTH - margin - bSize, margin); ctx.lineTo(WIDTH - margin, margin); ctx.lineTo(WIDTH - margin, margin + bSize);
            ctx.stroke();
            // BL
            ctx.beginPath();
            ctx.moveTo(margin, HEIGHT - margin - bSize); ctx.lineTo(margin, HEIGHT - margin); ctx.lineTo(margin + bSize, HEIGHT - margin);
            ctx.stroke();
            // BR
            ctx.beginPath();
            ctx.moveTo(WIDTH - margin - bSize, HEIGHT - margin); ctx.lineTo(WIDTH - margin, HEIGHT - margin); ctx.lineTo(WIDTH - margin, HEIGHT - margin - bSize);
            ctx.stroke();
        }

        // NARA Rendering Interface
        window.__renderTick = function(frameIndex, targetFps) {
            renderFrame(frameIndex);
        };

        // Interactive Preview Loop
        let previewFrame = 0;
        function animLoop() {
            if (!window.__isNaraHeadless) {
                renderFrame(previewFrame);
                previewFrame = (previewFrame + 1) % TOTAL_FRAMES;
                requestAnimationFrame(animLoop);
            }
        }

        // Auto-fit Logic
        function autoFitStage() {
            const container = document.getElementById('stage-container');
            const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
            container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        window.addEventListener('resize', autoFitStage);
        window.addEventListener('DOMContentLoaded', () => {
            autoFitStage();
            requestAnimationFrame(animLoop);
        });
    </script>
</body>
</html>

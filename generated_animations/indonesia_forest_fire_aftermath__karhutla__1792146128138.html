METADATA--><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #stage-container {
            position: relative;
            width: 1080px;
            height: 1920px;
            background: #F5F7FA;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        #stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }
    </style>
</head>
<body>
    <div id="stage-container">
        <canvas id="stage" width="1080" height="1920"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const TOTAL_FRAMES = 1500;
        const WIDTH = 1080;
        const HEIGHT = 1920;

        // Deterministic Random
        function seededRandom(s) {
            const x = Math.sin(s) * 10000;
            return x - Math.floor(x);
        }

        // Indonesia Island Polygons (Simplified for motion graphics)
        const islands = [
            { name: "SUMATRA", path: [[150, 600], [350, 850], [400, 1050], [200, 1150], [100, 900]], firePoints: [[250, 800], [320, 950]] },
            { name: "JAVA", path: [[350, 1200], [650, 1250], [700, 1300], [400, 1300]], firePoints: [[500, 1250]] },
            { name: "KALIMANTAN", path: [[450, 700], [650, 650], [750, 800], [700, 1000], [500, 1000]], firePoints: [[550, 850], [650, 900], [600, 750]] },
            { name: "SULAWESI", path: [[780, 750], [850, 750], [850, 950], [780, 950], [800, 850], [750, 850]], firePoints: [[820, 850]] },
            { name: "PAPUA", path: [[900, 850], [1050, 900], [1050, 1100], [950, 1150], [920, 1000]], firePoints: [[980, 1000]] }
        ];

        function drawIsland(island, progress, colorPhase) {
            ctx.beginPath();
            island.path.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p[0], p[1]);
                else ctx.lineTo(p[0], p[1]);
            });
            ctx.closePath();
            
            // Color interpolation
            let color;
            if (colorPhase < 0.3) { // Healthy Green
                color = '#2D5A27';
            } else if (colorPhase < 0.7) { // Burnt Black
                const t = (colorPhase - 0.3) / 0.4;
                const r = Math.floor(45 + (20 - 45) * t);
                const g = Math.floor(90 + (20 - 90) * t);
                const b = Math.floor(39 + (20 - 39) * t);
                color = `rgb(${r},${g},${b})`;
            } else { // Recovery Green
                const t = (colorPhase - 0.7) / 0.3;
                const r = Math.floor(20 + (76 - 20) * t);
                const g = Math.floor(20 + (175 - 20) * t);
                const b = Math.floor(20 + (80 - 20) * t);
                color = `rgb(${r},${g},${b})`;
            }
            
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawFire(x, y, intensity, frameIndex) {
            const particles = 12;
            ctx.globalCompositeOperation = 'screen';
            for (let i = 0; i < particles; i++) {
                const seed = i * 1.5;
                const life = (frameIndex * 0.05 + seededRandom(seed)) % 1;
                const size = (1 - life) * 40 * intensity;
                const offsetY = life * -100;
                const offsetX = Math.sin(frameIndex * 0.1 + seed) * 20;
                
                const grad = ctx.createRadialGradient(x + offsetX, y + offsetY, 0, x + offsetX, y + offsetY, size);
                grad.addColorStop(0, 'rgba(255, 200, 0, 0.8)');
                grad.addColorStop(0.5, 'rgba(255, 60, 0, 0.5)');
                grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x + offsetX, y + offsetY, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawSmoke(frameIndex, intensity) {
            if (intensity <= 0) return;
            ctx.save();
            for (let i = 0; i < 60; i++) {
                const seed = i * 13.37;
                const x = seededRandom(seed) * WIDTH;
                const y = ((seededRandom(seed + 1) * HEIGHT) - (frameIndex * 2)) % HEIGHT;
                const finalY = y < 0 ? y + HEIGHT : y;
                const size = 100 + seededRandom(seed + 2) * 300;
                
                ctx.beginPath();
                const opacity = (0.1 + seededRandom(seed + 3) * 0.2) * intensity;
                ctx.fillStyle = `rgba(100, 100, 110, ${opacity})`;
                ctx.arc(x, finalY, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function renderFrame(frameIndex) {
            const progress = frameIndex / TOTAL_FRAMES;
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            
            // Background
            ctx.fillStyle = '#F5F7FA';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Phase logic
            let islandColorPhase = 0;
            let fireIntensity = 0;
            let smokeIntensity = 0;
            let title = "";
            let subtitle = "";
            let titleAlpha = 0;

            if (progress < 0.2) { // Intro Healthy
                islandColorPhase = 0.2;
                title = "INDONESIA";
                subtitle = "The Emerald of the Equator";
                titleAlpha = Math.min(1, progress * 10);
            } else if (progress < 0.4) { // Fire Outbreak
                const p = (progress - 0.2) / 0.2;
                islandColorPhase = 0.2 + p * 0.3;
                fireIntensity = p;
                smokeIntensity = p * 0.5;
                title = "KARHUTLA";
                subtitle = "Forest and Land Fires Detected";
                titleAlpha = 1;
                ctx.translate(Math.sin(frameIndex * 0.5) * 3 * p, Math.cos(frameIndex * 0.5) * 3 * p);
            } else if (progress < 0.7) { // Aftermath / Haze
                const p = (progress - 0.4) / 0.3;
                islandColorPhase = 0.5 + p * 0.2;
                fireIntensity = 1 - p;
                smokeIntensity = 0.5 + p * 0.5;
                title = "HAZE CRISIS";
                subtitle = "Impact on Health & Ecosystem";
                titleAlpha = 1;
            } else if (progress < 0.9) { // Recovery
                const p = (progress - 0.7) / 0.2;
                islandColorPhase = 0.7 + p * 0.3;
                smokeIntensity = 1 - p;
                title = "REFORESTATION";
                subtitle = "Healing the Lungs of the World";
                titleAlpha = 1;
            } else { // Outro
                islandColorPhase = 1.0;
                title = "STOP KARHUTLA";
                subtitle = "Protect Our Future";
                titleAlpha = Math.max(0, 1 - (progress - 0.9) * 10);
            }

            // Draw Islands
            ctx.save();
            ctx.translate(0, 100); // Center the map a bit
            islands.forEach(island => {
                drawIsland(island, progress, islandColorPhase);
                if (fireIntensity > 0) {
                    island.firePoints.forEach(fp => {
                        drawFire(fp[0], fp[1], fireIntensity, frameIndex);
                    });
                }
            });
            ctx.restore();

            // Smoke Overlay
            drawSmoke(frameIndex, smokeIntensity);

            // Text Elements
            ctx.textAlign = 'center';
            ctx.fillStyle = `rgba(44, 62, 80, ${titleAlpha})`;
            
            // Main Title
            ctx.font = 'bold 80px sans-serif';
            ctx.fillText(title, WIDTH / 2, 400);
            
            // Subtitle
            ctx.font = '300 40px sans-serif';
            ctx.fillStyle = `rgba(127, 140, 141, ${titleAlpha})`;
            ctx.fillText(subtitle, WIDTH / 2, 460);

            // UI Decoration
            ctx.strokeStyle = `rgba(44, 62, 80, ${titleAlpha * 0.3})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(WIDTH/2 - 100, 425);
            ctx.lineTo(WIDTH/2 + 100, 425);
            ctx.stroke();

            // Progress Bar (Bottom)
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.fillRect(100, 1750, WIDTH - 200, 10);
            ctx.fillStyle = fireIntensity > 0.5 ? '#E74C3C' : '#27AE60';
            ctx.fillRect(100, 1750, (WIDTH - 200) * progress, 10);

            // Frame Counter (Commercial Style)
            ctx.font = '16px monospace';
            ctx.fillStyle = '#95A5A6';
            ctx.textAlign = 'left';
            ctx.fillText(`SEQ_ID: NARA_ID_2024`, 100, 1730);
            ctx.textAlign = 'right';
            ctx.fillText(`TIMESTAMP: ${Math.floor(frameIndex/60)}s / 25s`, WIDTH - 100, 1730);
        }

        window.__renderTick = function(frameIndex, targetFps) {
            renderFrame(frameIndex);
        };

        let previewFrame = 0;
        function animLoop() {
            if (!window.__isNaraHeadless) {
                renderFrame(previewFrame);
                previewFrame = (previewFrame + 1) % TOTAL_FRAMES;
                requestAnimationFrame(animLoop);
            }
        }

        function autoFitStage() {
            const container = document.getElementById('stage-container');
            const stage = document.getElementById('stage');
            const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
            stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
        }

        window.addEventListener('resize', autoFitStage);
        window.addEventListener('DOMContentLoaded', () => {
            autoFitStage();
            requestAnimationFrame(animLoop);
        });
    </script>
</body>
</html>
